# Managed by secure-agent-workflow bootstrap. Change the template in
# secure-agent-workflow/bootstrap/files/tier-check.yml and re-run bootstrap,
# not this copy. `bootstrap.sh <repo> --update-gate <sha>` moves the pin.
#
# Tier check (ADR-003), a required check on the default branch. Separate from
# gate.yml because it re-runs on every review and the scanners don't need to.
# On a review it re-runs this workflow's pull_request run, which needs
# actions: write. No concurrency group: a review would cancel that run.

name: tier-check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  tier:
    uses: danjamk/secure-agent-workflow/.github/workflows/tier-check.yml@d8a81c53ed96f8eac05fe9ec6517c01688d7a3e2
    permissions:
      contents: read
      pull-requests: read
      actions: write
