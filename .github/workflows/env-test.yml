# Throwaway test for secure-agent-workflow #30: which environments a PR run and
# a push to main can use, and the OIDC subject a preview job gets. Removed after.

name: env-test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  preview-from-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      id-token: write
    steps:
      - name: Print the OIDC subject (never the token)
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print("sub:", json.loads(base64.urlsafe_b64decode(p))["sub"])' "$token"

  staging-from-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "staging accepted a PR run"

  production-from-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "production accepted a PR run"

  staging-from-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "staging accepted main"

  production-from-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "production accepted main"
